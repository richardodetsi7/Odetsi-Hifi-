<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RichMi Invoice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RichMi Invoice">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#022758">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#eef3fa;color:#0b1f44;-webkit-text-size-adjust:100%}
.topbar{position:sticky;top:0;z-index:5;background:#022758;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.topbar b{font-size:18px;letter-spacing:.2px}
.topbar span{font-size:13px;opacity:.75}
.panel{display:none;padding:14px 14px 150px;max-width:720px;margin:0 auto}
.panel.on{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(2,39,88,.08)}
.card h2{font-size:17px;margin:0 0 10px}
label{display:block;font-size:13px;color:#4a5f82;margin-bottom:10px}
input[hidden]{display:none!important}
input,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font-size:16px;font-family:inherit;color:#0b1f44;background:#f6f9fd;border:1px solid #cddcf0;border-radius:10px;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{outline:2px solid #0a5bd8;border-color:#0a5bd8;background:#fff}
textarea{resize:vertical}
.grid3{display:grid;grid-template-columns:1.6fr .8fr;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:12px 16px;background:#0a5bd8;color:#fff;font-weight:600}
button.ghost{background:#e3edfb;color:#0a3d91}
button.danger{background:#fde8e8;color:#b42318}
button.link{background:none;color:#b42318;padding:4px 6px;font-weight:600}
button.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>button{flex:1}
.thumb{width:64px;height:48px;object-fit:contain;background:#fff;border:1px solid #cddcf0;border-radius:8px}
.thumb.empty{display:flex;align-items:center;justify-content:center;font-size:11px;color:#8aa0c2}
.linetotal{margin-top:10px;padding-top:10px;border-top:1px dashed #cddcf0;display:flex;justify-content:space-between;font-size:14px}
.totalbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));background:#0a5bd8;color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;z-index:6}
.totalbar b{font-size:20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-top:1px solid #cddcf0;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{background:none;color:#6b7fa3;border-radius:0;padding:17px 4px;font-size:14px}
.tabbar button.on{color:#0a5bd8;box-shadow:inset 0 3px 0 #0a5bd8}
.hint{font-size:13px;color:#4a5f82;margin:0 0 10px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#022758;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.saved{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #e3edfb}
.saved:last-child{border:0}
.saved small{display:block;color:#6b7fa3;margin-top:2px}
.toolbar{margin-bottom:12px}
#paperWrap{width:100%;overflow:hidden;background:#fff;box-shadow:0 1px 6px rgba(2,39,88,.2)}

/* ---------- Invoice paper (A4, 794px wide) ---------- */
#paper{width:794px;min-height:1120px;background:#fff;color:#0b2a5c;font-family:"Helvetica Neue",Arial,sans-serif;transform-origin:top left;display:flex;flex-direction:column;position:relative;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#paper *{box-sizing:border-box}
.ph{position:relative;height:168px;border-bottom:1px solid #b7cdea}
.ph .logo{position:absolute;left:18px;top:22px;width:410px}
.ph .bA{position:absolute;right:0;top:0;width:372px;height:168px;background:#0a5bd8;clip-path:polygon(80px 0,100% 0,100% 100%,0 100%)}
.ph .bB{position:absolute;right:0;top:0;width:344px;height:168px;background:#022758;clip-path:polygon(80px 0,100% 0,100% 100%,0 100%)}
.ph .ttl{position:absolute;right:26px;top:20px;text-align:right;color:#fff}
.ph .ttl h1{margin:0;font-size:44px;font-weight:800;letter-spacing:.5px;line-height:1}
.ph .ttl .no{margin-top:10px;font-size:22px;color:#4d9bff;border-bottom:1px solid #2a4f8f;padding-bottom:6px;display:inline-block;min-width:190px}
.ph .ttl .d{font-size:15px;margin-top:8px;line-height:1.55}
.ph .ttl .d b{font-weight:700}
.pf{display:flex;justify-content:space-between;padding:16px 24px 8px;gap:20px}
.badge{display:inline-block;background:#0a5bd8;color:#fff;font-weight:700;font-size:16px;padding:3px 14px;border-radius:5px}
.from .nm{font-size:23px;font-weight:800;margin:8px 0 8px;color:#022758}
.from .r{display:flex;align-items:center;gap:12px;font-size:14.5px;margin:7px 0}
.from svg{width:20px;height:20px;fill:#022758;flex:none}
.billto{width:340px;background:#eaf4fe;border-radius:10px;padding:12px 16px;align-self:flex-start;min-height:120px}
.billto .r{display:flex;gap:10px;font-size:14.5px;margin-top:10px;line-height:1.35}
.billto .r span{width:64px;flex:none;color:#2c4a7c}
.billto .r b{font-weight:700;color:#022758;word-break:break-word}
.billto .r.n b{font-size:17px}
.sh{margin:6px 24px 0;border-top:1px solid #b7cdea;padding-top:8px;display:flex;justify-content:space-between;align-items:center}
.sh h2{margin:0;font-size:38px;font-weight:900;color:#022758;letter-spacing:.3px;line-height:1.05}
.sh p{margin:2px 0 0;font-size:19px;font-weight:700;color:#022758}
.rib{position:relative;width:370px;height:44px;margin-right:-24px;background:#022758;clip-path:polygon(34px 0,100% 0,100% 100%,0 100%);color:#fff;font-style:italic;font-size:15.5px;display:flex;align-items:center;padding-left:56px}
.rib:before{content:"";position:absolute;left:0;top:0;width:44px;height:100%;background:#0a5bd8;clip-path:polygon(34px 0,44px 0,10px 100%,0 100%)}
table.it{margin:14px 24px 0;width:calc(100% - 48px);border-collapse:separate;border-spacing:0;border:1px solid #9dbbe3;border-radius:8px;overflow:hidden}
.it th{background:#022758;color:#fff;font-size:13.5px;padding:9px 6px;text-align:center;border-right:1px solid #1d4585;line-height:1.2}
.it th:last-child{border-right:0}
.it td{border-top:1px solid #b7cdea;border-right:1px solid #b7cdea;padding:8px;font-size:14.5px;font-weight:700;text-align:center;vertical-align:middle;color:#0b2a5c}
.it td:last-child{border-right:0}
.it td.d{text-align:left;font-weight:400}
.dsc{display:flex;gap:12px;align-items:center}
.dsc img{width:112px;height:auto;max-height:130px;object-fit:contain;flex:none}
.dsc h4{margin:0 0 5px;font-size:16px;font-weight:800;color:#022758}
.dsc ul{margin:0;padding-left:16px;font-size:12.5px;line-height:1.55;color:#1d4585}
.mid{display:flex;gap:22px;margin:18px 24px 0}
.sum{width:50%;flex:none;border:1px solid #9dbbe3;border-radius:8px;overflow:hidden;align-self:flex-start}
.sum .h{background:#022758;color:#fff;font-weight:800;font-size:15px;padding:9px 14px}
.sum .l{display:flex;justify-content:space-between;padding:10px 14px;font-size:14px;border-top:1px solid #c9dbf2;background:#f2f8ff}
.sum .l b{font-size:15px}
.sum .t{display:flex;justify-content:space-between;align-items:center;background:#0a5bd8;color:#fff;padding:13px 14px;font-weight:800;font-size:17px}
.sum .t b{font-size:22px}
.bank{flex:1;background:#eaf4fe;border-radius:10px;padding:12px 16px}
.bank h3{margin:0 0 8px;font-size:18px;color:#022758;display:flex;align-items:center;gap:10px}
.bank h3 small{font-size:13px;font-weight:400}
.bank svg{width:34px;height:34px;fill:#022758}
.bank .r{display:flex;font-size:14px;margin:6px 0}
.bank .r span{width:122px;color:#2c4a7c}
.bank .r b{color:#022758}
.low{display:flex;gap:22px;margin:16px 24px 18px}
.terms{width:50%;flex:none;border-top:1px solid #b7cdea;padding-top:10px}
.terms h3{margin:0 0 6px;font-size:16px;color:#022758}
.terms ol{margin:0;padding-left:20px;font-size:12px;line-height:1.7;color:#1d4585}
.thx{flex:1;border-left:1px solid #022758;padding-left:22px}
.thx .s{font-family:"Snell Roundhand","Brush Script MT","Apple Chancery",cursive;font-style:italic;font-size:38px;color:#0a3d91;line-height:1.1}
.thx p{margin:4px 0 14px;font-size:15px}
.thx .sg{border-top:1px solid #0a5bd8;padding-top:8px;font-weight:800;font-size:15px}
.thx .sg small{display:block;font-weight:400;font-size:13px;margin-top:2px}
.pfoot{margin-top:auto;background:#022758;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:14px}
.pfoot .a{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;line-height:1.1}
.pfoot .a small{display:block;font-size:11px;font-weight:400}
.pfoot svg{width:30px;height:30px;fill:#fff}
.pfoot .b{flex:1;font-size:11.5px;border-left:1px solid #3b5a8f;border-right:1px solid #3b5a8f;padding:2px 14px;line-height:1.6}
.pfoot .b b{font-size:12.5px}
.pfoot .c{text-align:right;font-size:21px;font-weight:800}
.pfoot .c small{display:block;font-size:8.5px;letter-spacing:1.6px;font-weight:400}
.pfoot .c i{font-style:normal;color:#4d9bff}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .topbar,.tabbar,.totalbar,.toolbar,.toast,.panel{display:none!important}
  #p-preview{display:block!important;padding:0;max-width:none}
  #paperWrap{height:auto!important;overflow:visible;box-shadow:none}
  #paper{transform:none!important}
  tr{page-break-inside:avoid}
}
</style>
</head>
<body>

<div class="topbar"><b>RichMi Invoice</b><span>Works offline</span></div>

<!-- ============ INVOICE (edit) ============ -->
<main class="panel on" id="p-edit"></main>

<!-- ============ PREVIEW ============ -->
<main class="panel" id="p-preview">
  <div class="toolbar btns">
    <button id="btnPrint">Print / Save as PDF</button>
    <button class="ghost" id="btnSave">Save invoice</button>
  </div>
  <p class="hint toolbar">To share: tap Print / Save as PDF, then pinch out on the preview page and tap the Share button. Or take a screenshot.</p>
  <div id="paperWrap"><div id="paper"></div></div>
</main>

<!-- ============ SAVED ============ -->
<main class="panel" id="p-saved"></main>

<!-- ============ SETTINGS ============ -->
<main class="panel" id="p-settings"></main>

<div class="totalbar" id="totalbar"><span>Total due</span><b id="tb">GHS 0.00</b></div>
<nav class="tabbar">
  <button data-tab="edit" class="on">Invoice</button>
  <button data-tab="preview">Preview</button>
  <button data-tab="saved">Saved</button>
  <button data-tab="settings">Settings</button>
</nav>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

const KEY="odetsi_invoice_v1";
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const $=s=>document.querySelector(s);

/* ---------- state ---------- */
function isoToday(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function blankItem(){return{name:"",details:"",unit:"",disc:"",qty:"1",img:""}}
function newInvoice(no){
  return{no:no,date:isoToday(),due:isoToday(),title:"",customer:{name:"",phone:"",address:"",email:""},items:[blankItem()]};
}
function defaults(){
  const inv=newInvoice(1);
  inv.title="Samsung Q990 Series Home Theatre System";
  inv.items=[{name:"Samsung Q990 Series",details:"11.1.4 Channel Sound\nDolby Atmos / DTS:X\nWireless Rear Speakers\nPowerful Subwoofer\nPremium Sound Experience",unit:"23000",disc:"",qty:"1",img:"default"}];
  return{
    seller:{name:"Odetsi Richard",phone:"0543231232",location:"Ghana",bank:"",branch:"",accName:"",accNo:"",rep:"Sales Representative"},
    tagline:"Immersive Sound. Cinematic Experience.",
    terms:["Payment can be made via bank transfer to the above account.","Goods will be released upon confirmation of payment.","Warranty period and delivery details will be confirmed upon payment.","This invoice is valid for 7 days from the date of issue.","All prices are in Ghana Cedis (GHS)."],
    current:inv,saved:[]
  };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.current){S=defaults()}
S.current.no=Number(S.current.no)||1;
let lastSaved=false;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Storage full – remove some saved invoices or photos")}}

/* ---------- helpers ---------- */
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const num=v=>parseFloat(String(v==null?"":v).replace(/,/g,""))||0;
const fmt=n=>"GHS "+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(6,"0");
function longDate(iso){const p=(iso||"").split("-");if(p.length<3)return"";return(+p[2])+" "+MONTHS[+p[1]-1]+" "+p[0]}
function getP(o,p){return p.split(".").reduce((a,k)=>a&&a[k],o)}
function setP(o,p,v){const k=p.split(".");const last=k.pop();const t=k.reduce((a,x)=>a[x],o);t[last]=v}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),1800)}
function imgSrc(i){return i==="default"?PROD:i}
function calc(inv){
  let sub=0,total=0,count=0;
  const rows=inv.items.map(it=>{
    const unit=num(it.unit),d=0,q=num(it.qty);
    const eff=d>0?d:unit;
    sub+=unit*q;total+=eff*q;count+=q;
    return{unit,eff,q,line:eff*q,hasDisc:d>0};
  });
  return{rows,sub,total,disc:sub-total,count};
}

/* ---------- edit panel ---------- */
function buildEdit(){
  const c=S.current;
  let h=`
  <div class="card"><h2>Invoice details</h2>
    <div class="grid2">
      <label>Invoice number<input inputmode="numeric" data-p="current.no" value="${esc(c.no)}"></label>
      <label>Date<input type="date" data-p="current.date" value="${esc(c.date)}"></label>
    </div>
    <label>Due date<input type="date" data-p="current.due" value="${esc(c.due)}"></label>
    <label>Invoice subtitle<input data-p="current.title" placeholder="e.g. Samsung Q990 Series Home Theatre System" value="${esc(c.title)}"></label>
  </div>
  <div class="card"><h2>Bill to</h2>
    <label>Name<input data-p="current.customer.name" placeholder="Customer name" value="${esc(c.customer.name)}"></label>
    <label>Phone (optional)<input inputmode="tel" data-p="current.customer.phone" value="${esc(c.customer.phone)}"></label>
    <label>Address (optional)<input data-p="current.customer.address" value="${esc(c.customer.address)}"></label>
    <label>Email (optional)<input inputmode="email" autocapitalize="off" data-p="current.customer.email" value="${esc(c.customer.email)}"></label>
    <p class="hint" style="margin:0">Empty optional fields are left off the invoice.</p>
  </div>`;
  c.items.forEach((it,i)=>{
    const src=imgSrc(it.img);
    h+=`<div class="card"><div class="row between"><h2 style="margin:0">Item ${i+1}</h2>${c.items.length>1?`<button class="link" data-act="del" data-i="${i}">Remove item</button>`:""}</div>
    <label style="margin-top:10px">Product name<input data-p="current.items.${i}.name" value="${esc(it.name)}"></label>
    <label>Details (one point per line)<textarea rows="4" data-p="current.items.${i}.details">${esc(it.details)}</textarea></label>
    <div class="grid3">
      <label>Unit price<input inputmode="decimal" data-p="current.items.${i}.unit" placeholder="0.00" value="${esc(it.unit)}"></label>
      <label>Qty<input inputmode="numeric" data-p="current.items.${i}.qty" value="${esc(it.qty)}"></label>
    </div>
    <div class="row">${src?`<img class="thumb" src="${src}" alt="">`:`<div class="thumb empty">No photo</div>`}
      <button class="ghost" data-act="photo" data-i="${i}">${src?"Change photo":"Add photo"}</button>
      ${src?`<button class="ghost" data-act="nophoto" data-i="${i}">Remove photo</button>`:""}</div>
    <div class="linetotal"><span>Line total</span><b id="lt${i}"></b></div></div>`;
  });
  h+=`<button class="ghost wide" data-act="add" style="margin-bottom:14px">+ Add another item</button>
  <div class="btns"><button data-act="save">Save invoice</button><button class="ghost" data-act="new">New invoice</button></div>`;
  $("#p-edit").innerHTML=h;
  updateLive();
}
function updateLive(){
  const r=calc(S.current);
  r.rows.forEach((x,i)=>{const e=$("#lt"+i);if(e)e.textContent=fmt(x.line)});
  $("#tb").textContent=fmt(r.total);
}

/* ---------- preview ---------- */
const IC={
 phone:'<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.6 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.6 3.6a1 1 0 01-.25 1z"/></svg>',
 pin:'<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 119.5 9 2.5 2.5 0 0112 11.5z"/></svg>',
 bank:'<svg viewBox="0 0 24 24"><path d="M4 10v7h3v-7H4zm6.5 0v7h3v-7h-3zM2 22h19v-3H2v3zm14-12v7h3v-7h-3zM11.5 1L2 6v2h19V6l-9.5-5z"/></svg>',
 user:'<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-8 2-8 5v1h16v-1c0-3-4-5-8-5z"/></svg>',
 card:'<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>'
};
function buildPaper(){
  const c=S.current,s=S.seller,r=calc(c);
  const cu=c.customer;
  const bill=[`<div class="r n"><span>Name:</span><b>${esc(cu.name)}</b></div>`];
  if(cu.phone.trim())bill.push(`<div class="r"><span>Phone:</span><b>${esc(cu.phone)}</b></div>`);
  if(cu.address.trim())bill.push(`<div class="r"><span>Address:</span><b>${esc(cu.address)}</b></div>`);
  if(cu.email.trim())bill.push(`<div class="r"><span>Email:</span><b>${esc(cu.email)}</b></div>`);
  const rows=c.items.map((it,i)=>{
    const x=r.rows[i];
    const src=imgSrc(it.img);
    const pts=it.details.split("\n").map(t=>t.trim()).filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join("");
    return`<tr><td>${i+1}</td><td class="d"><div class="dsc">${src?`<img src="${src}" alt="">`:""}<div><h4>${esc(it.name)}</h4>${pts?`<ul>${pts}</ul>`:""}</div></div></td>
    <td>${fmt(x.unit)}</td><td>${esc(num(it.qty))}</td><td>${fmt(x.line)}</td></tr>`;
  }).join("");
  const hasBank=!!(s.bank.trim()||s.branch.trim()||s.accName.trim()||s.accNo.trim());
  const bl=[s.bank,s.branch].map(x=>x.trim()).filter(Boolean).join(" – ");
  const bankRow=(l,v)=>v.trim()?`<div class="r"><span>${l}</span><b>: ${esc(v)}</b></div>`:"";
  const terms=S.terms.map(t=>`<li>${esc(t)}</li>`).join("");
  $("#paper").innerHTML=`
  <div class="ph"><img class="logo" src="${LOGO}" alt="">
    <div class="bA"></div><div class="bB"></div>
    <div class="ttl"><h1>INVOICE</h1><div class="no">No. ${pad(c.no)}</div>
    <div class="d"><b>Date:</b> ${esc(longDate(c.date))}<br><b>Due Date:</b> ${esc(longDate(c.due))}</div></div></div>
  <div class="pf">
    <div class="from"><span class="badge">From</span><div class="nm">${esc(s.name)}</div>
      <div class="r">${IC.phone}<span>${esc(s.phone)}</span></div>
      <div class="r">${IC.pin}<span>${esc(s.location)}</span></div>
      ${bl?`<div class="r">${IC.bank}<span>${esc(bl)}</span></div>`:""}
      ${s.accName.trim()?`<div class="r">${IC.user}<span>Account Name: ${esc(s.accName)}</span></div>`:""}
      ${s.accNo.trim()?`<div class="r">${IC.card}<span>Account Number: ${esc(s.accNo)}</span></div>`:""}</div>
    <div class="billto"><span class="badge">Bill To</span>${bill.join("")}</div>
  </div>
  <div class="sh"><div><h2>SALES INVOICE</h2>${c.title.trim()?`<p>${esc(c.title)}</p>`:""}</div>${S.tagline.trim()?`<div class="rib">${esc(S.tagline)}</div>`:""}</div>
  <table class="it"><thead><tr><th style="width:42px">No.</th><th>Description</th><th style="width:130px">Unit Price<br>(GHS)</th><th style="width:70px">Quantity</th><th style="width:132px">Total<br>(GHS)</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="mid">
    <div class="sum"><div class="h">PRICE SUMMARY</div>
      <div class="l"><span>Subtotal (${r.count} item${r.count===1?"":"s"})</span><b>${fmt(r.sub)}</b></div>
      ${r.disc>0?`<div class="l"><span>Total Discount</span><b>${fmt(r.disc)}</b></div>`:""}
      <div class="t"><span>TOTAL AMOUNT DUE</span><b>${fmt(r.total)}</b></div></div>
    ${hasBank?`<div class="bank"><h3>${IC.bank}<span>BANK DETAILS <small>(For Payment)</small></span></h3>
      ${bankRow("Bank Name",s.bank)}${bankRow("Branch",s.branch)}${bankRow("Account Name",s.accName)}${bankRow("Account Number",s.accNo)}</div>`:`<div class="bank" style="background:none"></div>`}
  </div>
  <div class="low">
    <div class="terms"><h3>TERMS &amp; CONDITIONS</h3><ol>${terms}</ol></div>
    <div class="thx"><div class="s">Thank you!</div><p>For your trust and support.</p>
      <div class="sg">${esc(s.name)}<small>${esc(s.rep)}</small></div></div>
  </div>
  <div class="pfoot">
    <div class="a">${IC.phone}<div>${esc(s.phone)}<small>Call / WhatsApp</small></div></div>
    ${hasBank?`<div class="b">${bl?`<b>${esc(bl)}</b><br>`:""}${[s.accName.trim()?"Acc. Name: "+esc(s.accName):"",s.accNo.trim()?"Acc. No: "+esc(s.accNo):""].filter(Boolean).join(" &nbsp;|&nbsp; ")}</div>`:`<div class="b" style="border:0"></div>`}
    <div class="c">RichMi <i>Hifi</i><small>PREMIUM AUDIO | BETTER LIVING</small></div>
  </div>`;
  fitPaper();
}
function fitPaper(){
  const w=$("#paperWrap"),p=$("#paper");
  if(!w.clientWidth)return;
  const sc=Math.min(1,w.clientWidth/794);
  p.style.transform="scale("+sc+")";
  w.style.height=(p.offsetHeight*sc)+"px";
}
window.addEventListener("resize",fitPaper);
window.addEventListener("beforeprint",()=>{$("#paper").style.transform="none"});
window.addEventListener("afterprint",fitPaper);

/* ---------- saved ---------- */
function buildSaved(){
  const list=S.saved.slice().sort((a,b)=>b.no-a.no);
  let h=`<div class="card"><h2>Saved invoices</h2>`;
  if(!list.length)h+=`<p class="hint">Nothing saved yet. Tap <b>Save invoice</b> on the Invoice tab to keep a copy on this phone.</p>`;
  list.forEach(x=>{
    h+=`<div class="saved"><div><b>No. ${pad(x.no)} – ${esc(x.name||"No name")}</b><small>${esc(longDate(x.date))} · ${fmt(x.total)}</small></div>
    <div class="row"><button class="ghost" data-act="open" data-no="${x.no}">Open</button><button class="danger" data-act="rm" data-no="${x.no}">Delete</button></div></div>`;
  });
  h+=`</div>`;
  $("#p-saved").innerHTML=h;
}
function saveCurrent(){
  const c=S.current,r=calc(c);
  const rec={no:c.no,name:c.customer.name,date:c.date,total:r.total,data:JSON.parse(JSON.stringify(c))};
  const i=S.saved.findIndex(x=>x.no===c.no);
  if(i>=0)S.saved[i]=rec;else S.saved.push(rec);
  persist();toast("Invoice "+pad(c.no)+" saved");
}
function nextNo(){return Math.max(S.current.no,...S.saved.map(x=>x.no),0)+1}

/* ---------- settings ---------- */
function buildSettings(){
  const s=S.seller;
  const f=(k,l,extra="")=>`<label>${l}<input ${extra} data-p="seller.${k}" value="${esc(s[k])}"></label>`;
  $("#p-settings").innerHTML=`
  <div class="card"><h2>Your business</h2>
    ${f("name","Name")}${f("phone","Phone","inputmode=tel")}${f("location","Location")}${f("rep","Title under signature")}
  </div>
  <div class="card"><h2>Bank details</h2><p class="hint">Fill these in to show payment details on your invoices. Leave empty to hide them.</p>
    ${f("bank","Bank name")}${f("branch","Branch")}${f("accName","Account name")}${f("accNo","Account number","inputmode=numeric")}
  </div>
  <div class="card"><h2>Invoice wording</h2>
    <label>Banner slogan (leave empty to hide)<input data-p="tagline" value="${esc(S.tagline)}"></label>
    <label>Terms &amp; conditions (one per line)<textarea rows="6" id="termsBox">${esc(S.terms.join("\n"))}</textarea></label>
  </div>
  <button class="danger wide" data-act="reset">Erase everything on this phone</button>`;
}

/* ---------- events ---------- */
function show(tab){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+tab));
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  $("#totalbar").style.display=(tab==="edit"||tab==="preview")?"flex":"none";
  if(tab==="preview")buildPaper();
  if(tab==="saved")buildSaved();
  if(tab==="settings")buildSettings();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>show(b.dataset.tab));

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="termsBox"){S.terms=t.value.split("\n").map(x=>x.trim()).filter(Boolean);persist();return}
  if(!t.dataset.p)return;
  let v=t.value;
  if(t.dataset.p==="current.no")v=Math.max(1,parseInt(v,10)||1);
  setP(S,t.dataset.p,v);
  persist();updateLive();
});

let photoIdx=0;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==="add"){S.current.items.push(blankItem());persist();buildEdit();window.scrollTo(0,document.body.scrollHeight)}
  else if(a==="del"){if(confirm("Remove item "+(i+1)+"?")){S.current.items.splice(i,1);persist();buildEdit()}}
  else if(a==="photo"){photoIdx=i;$("#file").click()}
  else if(a==="nophoto"){S.current.items[i].img="";persist();buildEdit()}
  else if(a==="save"){saveCurrent()}
  else if(a==="new"){
    if(confirm("Start a new invoice? Save the current one first if you want to keep it.")){
      S.current=newInvoice(nextNo());persist();buildEdit();window.scrollTo(0,0);toast("New invoice "+pad(S.current.no))}
  }
  else if(a==="open"){
    const x=S.saved.find(y=>y.no===+b.dataset.no);
    if(x){S.current=JSON.parse(JSON.stringify(x.data));persist();buildEdit();show("edit")}
  }
  else if(a==="rm"){
    if(confirm("Delete saved invoice "+pad(+b.dataset.no)+"?")){S.saved=S.saved.filter(y=>y.no!==+b.dataset.no);persist();buildSaved()}
  }
  else if(a==="reset"){
    if(confirm("This erases all saved invoices and settings on this phone. Continue?")){
      localStorage.removeItem(KEY);S=defaults();buildEdit();show("edit")}
  }
});
$("#file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const sc=Math.min(1,500/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
      const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,0,0,cv.width,cv.height);
      S.current.items[photoIdx].img=cv.toDataURL("image/jpeg",.8);
      persist();buildEdit();
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);e.target.value="";
};
$("#btnPrint").onclick=()=>{buildPaper();window.print()};
$("#btnSave").onclick=saveCurrent;

/* ---------- start ---------- */
buildEdit();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
